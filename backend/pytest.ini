[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Spec v1.1 pass 3, correction 10: registered test categories. --strict-markers
# makes an unregistered/misspelled @pytest.mark.<x> a collection ERROR rather
# than a silently-ignored no-op, so a typo'd marker can never quietly drop a
# test out of a filtered run. See tests/conftest.py's
# pytest_collection_modifyitems for how these are actually applied (most
# tests are auto-tagged `unit`; a smaller, explicitly-tagged set that
# exercises simulated-AWS behavior via moto is `integration`). `android`,
# `aws`, and `device` are registered here for a consistent vocabulary across
# every Python suite in this repository (mcp_server, alexa_plus_client,
# infrastructure, legacy) even though no PYTEST in this specific suite
# currently carries them — this backend suite has no Android/real-AWS/
# real-device tests to tag, and claiming otherwise would be exactly the kind
# of misleading category label this correction exists to prevent.
addopts = --strict-markers
markers =
    unit: fast, dependency-free test (no subprocess, no real network, no external service)
    integration: exercises multiple real components together (e.g. moto-simulated AWS, a real HTTP round trip between two in-process services)
    infrastructure: validates AWS SAM/CloudFormation templates (cfn-lint, sam validate/build) — see infrastructure/pytest.ini
    android: requires the Android SDK/Gradle toolchain (APK/AAB build) — not applicable to this backend suite
    aws: requires a REAL (non-mocked) AWS account/credentials — not applicable to this backend suite (see moto-based `integration` tests for the simulated equivalent)
    device: requires a real physical device (Fire TV hardware, a real Alexa+ device/console) — not applicable to this backend suite
