[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Spec v1.1 pass 3, correction 10: see backend/pytest.ini for the full
# rationale. Every test here spins up a real backend subprocess and a real
# mcp_server Streamable HTTP server — tests/conftest.py auto-tags all of
# them `integration`.
addopts = --strict-markers
markers =
    unit: fast, dependency-free test
    integration: exercises real subprocesses/real network round trips
    infrastructure: validates AWS SAM/CloudFormation templates — not applicable here
    android: requires the Android SDK/Gradle toolchain — not applicable here
    aws: requires a REAL (non-mocked) AWS account/credentials — not applicable here
    device: requires a real physical Alexa+ device/console — not applicable here (see SimulatedAlexaPlusClient)
