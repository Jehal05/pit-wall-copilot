# Pit Wall Copilot — AWS infrastructure (spec v1.1 repair 12).
#
# *** HONEST STATUS ***
# This template has been syntax/schema-validated with `cfn-lint` and
# `sam validate` (see docs/deployment-runbook.md for the exact commands),
# and `sam build` has been run against the two Lambda functions below in
# this environment (real `pip install` + real file packaging — no
# network-blocked step involved, unlike the Fire TV Gradle build
# documented in README.md). It has NOT been deployed against a real AWS
# account — there is no AWS access in this environment. Every ARN,
# security-group rule and IAM policy below has been reviewed against AWS's
# documented behavior and this repo's own actually-tested application
# code, but first-contact surprises on a real account (a typo'd
# subnet/VPC id, an IAM permission this template didn't anticipate, ACM
# certificate validation) should be expected — see
# docs/deployment-runbook.md's own honest-status note for the same
# caveat applied to the rest of Gate 5.
#
# What changed from the previous (Gate 5 / pre-repair-12) version of this
# file, and why:
#   - The Alexa Lambda's inline `Code: ZipFile:` placeholder that
#     deliberately raised RuntimeError has been REMOVED. Both Lambda
#     functions below are AWS::Serverless::Function resources with a real
#     CodeUri, so `sam build`/`sam package`/`sam deploy` package the
#     actual, already-tested application code — never a placeholder that
#     "runs" only by failing (spec v1.1's explicit instruction: "Do not
#     deploy an intentionally failing placeholder Lambda").
#   - A real DynamoDB-Streams-triggered Watch Evaluator Lambda has been
#     added (spec section 18: "DynamoDB Streams SHALL invoke the Watch
#     Evaluator whenever race state changes") — see
#     backend/app/lambda_handlers/watch_evaluator_stream.py's module
#     docstring for how it reuses the exact same WatchEvaluator the
#     long-running backend process already calls in-process.
#   - The backend and mcp_server, both long-running server processes (not
#     a fit for the Lambda execution model — see backend/Dockerfile's own
#     module docstring), are now provisioned as real ECS Fargate services
#     behind Application Load Balancers, rather than left entirely
#     undeployed. ALB is chosen over API Gateway WebSocket specifically
#     because the backend serves its own WebSocket endpoint natively,
#     in-process (`app/api/routes.py`'s `@router.websocket(...)`) — an ALB
#     passes a WebSocket upgrade straight through to the container with no
#     extra resources, whereas API Gateway WebSocket would require a
#     parallel connection-tracking table and Lambda integration this
#     backend's architecture was never built around (see
#     infrastructure/README.md's existing single-table design, which this
#     template does not change).
#   - Secrets Manager now owns the demo access token (a generated secret,
#     never a template parameter passed in cleartext) — see
#     `DemoAccessTokenSecret` below.
#   - CloudWatch alarms, X-Ray tracing, and a WAF rate-based rule on both
#     ALBs have been added — see the relevant resources' own comments.
#
# This template still does NOT provision a VPC — `VpcId`/`SubnetIds`
# parameters expect an existing VPC (this is a deliberate scope choice,
# not an oversight: a demo-scale deployment reusing an account's default
# VPC is far more common than this template opinionatedly creating a new
# one, and getting that wrong is exactly the kind of "picking a specific
# option on the deployer's behalf" the previous version of this file
# already declined to do for the backend's compute host).
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Pit Wall Copilot (spec v1.1 repair 12): DynamoDB table + Streams, the
  Watch Evaluator Lambda, the legacy Alexa skill Lambda, ECS Fargate
  services (backend + mcp_server) behind ALBs with WAF rate limiting,
  Secrets Manager, CloudWatch alarms and X-Ray tracing. See
  docs/deployment-runbook.md for full deployment steps and honest status.

Parameters:
  TableName:
    Type: String
    Default: pit-wall-race-state
    Description: >
      DynamoDB table name — must match DYNAMODB_TABLE_NAME passed to the
      backend (see .env.example / infrastructure/README.md).

  RaceId:
    Type: String
    Default: demo-race-001
    Description: Matches PIT_WALL_RACE_ID — which race this deployment talks about.

  EnableCrossInstanceEventBroker:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      AWS hackathon-final pass, P0-3. "true" provisions an Amazon
      ElastiCache Serverless (Redis/Valkey-compatible) cache and points the
      backend at it via EVENT_BROKER=redis / REDIS_URL, so WebSocket
      events fan out correctly across every BackendService task once
      DesiredCount is raised above 1 — see
      docs/adr/0001-cross-instance-event-broker.md. "false" (the default,
      matching this template's existing DesiredCount: 1 demo-scale
      default) keeps EVENT_BROKER=memory and provisions no cache, so a
      single-task demo deployment incurs no extra cost or resource.
      AWS hackathon-final pass, phase 4: this is no longer merely advice —
      the BackendDesiredCountRequiresCrossInstanceBroker Rule below
      REFUSES to deploy BackendDesiredCount > 1 unless this is "true",
      so a production rolling-deployment cannot silently ship with
      process-local (memory) event fan-out.

  BackendDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: >
      AWS hackathon-final pass, phase 4. Replaces the previously-hardcoded
      DesiredCount: 1 on BackendService — see this template's own prior
      comment on that property, which already documented that the
      deployment configuration (100% min-healthy / 200% max during a
      rolling deployment) was written to be correct for any count, just
      never actually parametrized. Raising this above 1 REQUIRES
      EnableCrossInstanceEventBroker=true (enforced by the
      BackendDesiredCountRequiresCrossInstanceBroker Rule below) — a
      multi-task backend with only the in-process event broker would
      silently drop WebSocket events for any client connected to a
      different task than the one that produced the event.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      An existing VPC to deploy the ALBs and Fargate services into (this
      template does not create one — see the module docstring above).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two subnets (in different AZs) in VpcId, used for both the
      ALBs and the Fargate tasks. For a demo-scale deployment these are
      typically the VPC's public subnets, with tasks given a public IP
      (AssignPublicIp: ENABLED below) rather than adding NAT gateways —
      fine for a demo, not a production hardening recommendation.

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      Optional ACM certificate ARN. When set, both ALBs terminate
      HTTPS/WSS on :443 (with :80 redirecting to it) using this
      certificate; when left blank, both serve plain HTTP/WS on :80 only
      — acceptable for a first local demo against a deployed backend, not
      for anything handling real user traffic.

  BackendImageUri:
    Type: String
    Default: ""
    Description: >
      ECR image URI for the backend (built from backend/Dockerfile — see
      docs/deployment-runbook.md Step A.2-3 for the build/push commands).
      Left blank by default so this template can still be validated
      (`sam validate` / `cfn-lint`) before an image has been pushed;
      required at actual deploy time (see the ImageUriProvided condition).

  McpServerImageUri:
    Type: String
    Default: ""
    Description: >
      ECR image URI for mcp_server (see infrastructure/README.md /
      mcp_server/README.md — a Dockerfile for it is provisioned by this
      repair alongside the SAM template; see
      docs/deployment-runbook.md Step B). Left blank by default, same
      reasoning as BackendImageUri.

  BedrockModelArn:
    Type: String
    Default: ""
    Description: >
      Optional. When set, the backend's ECS task role is granted
      bedrock:InvokeModel on exactly this model ARN (least privilege — no
      wildcard bedrock:* access), matching LLM_PROVIDER=bedrock /
      BEDROCK_MODEL_ID in .env.example. Leave blank to run with
      LLM_PROVIDER=template only (no Bedrock IAM grant at all).

  LlmProvider:
    Type: String
    Default: template
    AllowedValues: ["template", "bedrock"]
    Description: >
      AWS hackathon-final pass, phase 4. Actually wires LLM_PROVIDER into
      the deployed ECS task (see backend/app/config.py's Settings.llm_provider
      / backend/app/services/llm_client.py's build_llm_client) — the
      pre-phase-4 template granted `BedrockModelArn`'s IAM permission but
      never told the running container to use it, so the deployed backend
      silently ran the deterministic template narrator regardless of the
      IAM grant. "bedrock" requires BedrockModelArn to also be set (see
      the BedrockProviderRequiresModelArn Rule below) — the deploy is
      refused otherwise, rather than silently falling back while a judge
      or user believes Bedrock is active (this exact confusion is what
      `HACKATHON_DEMO_SCRIPT.md` (removed in the repo cleanup; see git history)/JUDGE_QA.md's source/fallback-labeling
      guidance exists to prevent at the UI layer; this Rule prevents the
      infra-level version of the same mistake).

  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-haiku-20240307-v1:0"
    Description: >
      Passed to the backend as BEDROCK_MODEL_ID when LlmProvider=bedrock.
      Must name the SAME model `BedrockModelArn` grants IAM access to —
      this template cannot verify that correspondence automatically (the
      ARN and the model id are independent parameters, by design, so this
      template never has to parse an ARN to extract a model id), so
      docs/deployment-runbook.md's Bedrock deployment steps say this
      explicitly as a manual cross-check before `sam deploy`.

  BedrockRegion:
    Type: String
    Default: "us-east-1"
    Description: >
      Passed to the backend as BEDROCK_REGION when LlmProvider=bedrock —
      the AWS region Bedrock model invocations are sent to, independent of
      AWS::Region (the region THIS stack itself is deployed in), since
      Bedrock model availability varies by region and a deployer may
      legitimately want to call a model hosted in a different region than
      the rest of this stack.

  XRayDaemonImage:
    Type: String
    Default: "public.ecr.aws/xray/aws-xray-daemon:3.3.14"
    Description: >
      AWS hackathon-final pass, phase 4: the X-Ray daemon sidecar image,
      now a parameter rather than hardcoded, specifically so it CAN be
      pinned to an immutable content digest (e.g.
      "public.ecr.aws/xray/aws-xray-daemon@sha256:<64 hex chars>")
      instead of the mutable version tag this defaults to. HONEST STATUS:
      this development environment has no route to any container
      registry (public ECR included — outbound network here is
      allow-listed to package registries and GitHub only) and no running
      Docker daemon, so the digest for 3.3.14 could NOT be resolved or
      verified here; fabricating one would be worse than leaving this as
      a tag; pinning it is therefore listed in
      EXTERNAL_RELEASE_CHECKLIST.md as a required manual step before a
      real production deploy. To resolve and pin it yourself, from a
      machine with real registry access: `docker buildx imagetools
      inspect public.ecr.aws/xray/aws-xray-daemon:3.3.14` (or `docker
      pull` + `docker inspect --format '{{index .RepoDigests 0}}'`),
      then pass the resulting `...@sha256:...` value as this parameter.

  TrustedProxyCidrs:
    Type: String
    Default: ""
    Description: >
      AWS hackathon-final pass, phase 4. Passed to the backend as
      TRUSTED_PROXY_CIDRS (see backend/app/services/client_ip.py) — a
      comma-separated list of CIDR ranges whose X-Forwarded-For header the
      backend will trust when resolving a request's real originating
      client IP (used for both rate limiting and audit logging; see
      client_ip.py's own module docstring for the full spoofing rationale).
      Pre-phase-4, this setting existed in application code but the
      template never passed ANY value into the deployed ECS task, so
      X-Forwarded-For was never trusted in a real deployment and every
      client behind the ALB shared one rate-limit bucket keyed to the
      ALB's own peer address (see P1-10's existing get_client_ip fix,
      which this parameter finally activates end-to-end). Leave blank to
      keep that pre-phase-4 behavior (no header trusted — a safe, if
      coarser, default). When set, this SHOULD be the VPC's own CIDR
      block (or the subnets' CIDRs) — the ALB itself, not an external
      party, is the only "immediate peer" a backend task ever sees on an
      awsvpc-mode Fargate task placed in the same VPC, so trusting
      X-Forwarded-For from that VPC's own CIDR range is what actually
      corresponds to "trust the ALB, not the public internet." This
      template does not expose the VPC's CIDR block as a parameter
      itself (VpcId is an opaque AWS::EC2::VPC::Id — see the module
      docstring's existing "this template does not provision a VPC"
      scope note), so the deployer supplies it directly, matching
      whatever CIDR their own VpcId/SubnetIds actually use.

  EnableOtelTracing:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      AWS hackathon-final pass, phase 5 (observability); repair pass,
      mandatory correction 4 extends this to BOTH ECS services. The ADOT
      (AWS Distro for OpenTelemetry) Collector sidecar on
      BackendTaskDefinition AND McpTaskDefinition (see OTelCollectorImage
      below) is always provisioned on both, the same way the xray-daemon
      sidecar above is always provisioned regardless of whether any given
      request is actually traced — an idle collector costs negligible
      CPU/memory at either task's Fargate size. This parameter is what
      actually gates emission: "true" sets OTEL_TRACING_ENABLED=true (on
      the backend container) and PIT_WALL_MCP_OTEL_TRACING_ENABLED=true
      (on the mcp-server container), both with their own
      *_OTLP_ENDPOINT=http://127.0.0.1:4318 pointed at that task's own
      local collector sidecar, turning on the OTel SDK wiring that
      already ships in both services either way (see
      backend/app/tracing.py and mcp_server/tracing.py, each a documented
      no-op whenever its own enabled flag is unset/false — this mirrors
      the LlmProvider/BedrockModelId pattern above of "code exists,
      infra decides whether it's wired live"). When enabled, each
      service sends spans over OTLP/HTTP on its own task's local 4318 to
      its own collector sidecar (an AwsXRayIdGenerator/AwsXRayPropagator
      pair in both tracing.py modules make those span/trace IDs
      interoperate with each other AND with the X-Ray IDs the
      xray-daemon sidecar independently produces from `Tracing: Active`
      Lambda invocations), and each collector re-exports its own
      service's spans to X-Ray via its own `awsxray` exporter — so a
      single logical request (Alexa+ -> the MCP server -> the backend ->
      DynamoDB/Bedrock) appears as ONE connected trace across both
      services and Lambda, all landing in the same X-Ray console. Left
      "false" (the default) both sidecars run but receive nothing, and
      this hackathon submission's default deploy does NOT emit OTel
      traces; flip this explicitly to exercise that path against a real
      AWS account. HONEST STATUS: this development sandbox has no AWS
      credentials and no route to a live ADOT collector, so this wiring
      has been validated with cfn-lint/sam validate and with
      backend/tests/test_tracing.py's and mcp_server/tests/test_tracing.py's
      OTLP-exporter-configuration/span-content unit tests only — NOT
      against a real collector or a real X-Ray console. See
      EXTERNAL_RELEASE_CHECKLIST.md.

  OTelCollectorImage:
    Type: String
    Default: "public.ecr.aws/aws-observability/aws-otel-collector:v0.42.0"
    Description: >
      AWS hackathon-final pass, phase 5. The ADOT Collector sidecar image,
      used only when EnableOtelTracing=true. Same honest caveat as
      XRayDaemonImage above: this sandbox has no route to any container
      registry and no Docker daemon, so this tag's digest could not be
      resolved or verified here. Pin to an immutable
      "...@sha256:<64 hex chars>" digest before a real production deploy
      (see XRayDaemonImage's description for the exact resolution
      command) — tracked in EXTERNAL_RELEASE_CHECKLIST.md.

  OtelTracesSampler:
    Type: String
    Default: "parentbased_traceidratio"
    AllowedValues:
      - "always_on"
      - "always_off"
      - "traceidratio"
      - "parentbased_always_on"
      - "parentbased_always_off"
      - "parentbased_traceidratio"
    Description: >
      AWS hackathon repair pass (operational correction: production trace
      sampling). Sets the standard OpenTelemetry `OTEL_TRACES_SAMPLER` env
      var on BOTH BackendTaskDefinition and McpTaskDefinition, only when
      EnableOtelTracing=true. Neither backend/app/tracing.py nor
      mcp_server/tracing.py pins an explicit `sampler=` argument on the
      `TracerProvider` they construct in production (test-constructed
      providers in both suites always pin `sampler=ALWAYS_ON` explicitly and
      are unaffected by this parameter) — so this env var, read by the OTel
      SDK itself via `sampling._get_from_env_or_default()`, is the ONLY
      thing that controls production sampling. The default,
      "parentbased_traceidratio" (paired with OtelTracesSamplerArg below),
      is a documented, safe, test-environment-appropriate ratio rather than
      sampling every request — a validation/demo deployment does not need
      100% sampling to prove the trace pipeline works end-to-end, and a
      lower ratio keeps this hackathon submission's OTLP collector and
      X-Ray costs negligible. `parentbased_*` values respect an existing
      upstream sampling decision (an unsampled parent stays unsampled) —
      see mcp_server/tests/test_tracing.py's
      TestProductionConfigurationPath parent-based test. Both this
      parameter and OtelTracesSamplerArg below are read directly from the
      running task's environment on every process start, so sampling can be
      changed by updating the task definition's environment and forcing a
      new deployment — NO container image rebuild is required.

  OtelTracesSamplerArg:
    Type: String
    Default: "0.10"
    Description: >
      Companion to OtelTracesSampler above. Sets `OTEL_TRACES_SAMPLER_ARG`
      on both task definitions, only when EnableOtelTracing=true. Meaningful
      only for a ratio-based OtelTracesSampler value (ignored by the SDK for
      always_on/always_off/parentbased_always_on/parentbased_always_off);
      interpreted as a probability in [0.0, 1.0]. The default "0.10" (10%)
      is this deployment's documented, cost-conscious PRODUCTION sampling
      ratio, chosen to keep OTLP collector and X-Ray costs low under real
      traffic volume. CORRECTION (repair pass): an earlier version of this
      description claimed a 10% ratio "reliably" produces a visible trace
      from "a small number of demo/smoke-test requests" — that claim was
      wrong. `parentbased_traceidratio` makes an INDEPENDENT random
      sampling decision per trace; at ratio 0.10, a batch of N requests has
      only a `1 - 0.9^N` chance of including at least one sampled trace
      (e.g. ~41% for N=5, ~65% for N=10) — nothing about a small demo/
      smoke-test batch is "reliable" at this ratio. This default is NOT
      the value to use while validating that the tracing pipeline works
      end-to-end. For that validation, temporarily override this parameter
      to "1.0" (paired with OtelTracesSampler=parentbased_traceidratio) so
      every validation request is traced deterministically, confirm the
      resulting connected trace in X-Ray, then redeploy with this
      parameter restored to its documented production default ("0.10") and
      verify the restored value in the final task definitions before
      calling tracing validation complete. See
      REAL-AWS-PRODUCTION-VALIDATION-REPORT.md's Observability section for
      the exact validate-then-restore procedure this deployment follows.

  AllowInsecureDemoHttp:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Spec v1.1 correction 4: secure transport (HTTPS/WSS) is the deployed
      default. Deploying either ECS service WITHOUT a CertificateArn is
      refused (see the Rules section below) unless this is explicitly set
      to "true" — an intentional, visible opt-in for local/demo-only
      testing against a deployed stack, never a silent fallback. Bearer
      tokens (DEMO_ACCESS_TOKEN, PIT_WALL_MCP_ACCESS_TOKEN) must never be
      sent over the resulting plaintext HTTP/WS in that mode; that is the
      caller's responsibility once they've opted in — this template cannot
      police traffic content, only refuse to default to it.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasBedrockModel: !Not [!Equals [!Ref BedrockModelArn, ""]]
  BackendImageProvided: !Not [!Equals [!Ref BackendImageUri, ""]]
  McpImageProvided: !Not [!Equals [!Ref McpServerImageUri, ""]]
  CrossInstanceEventBrokerEnabled: !Equals [!Ref EnableCrossInstanceEventBroker, "true"]
  # AWS hackathon-final pass, P2 (observability): OperationalDashboard
  # below references both BackendService/BackendUnhealthyHostsAlarm
  # (BackendImageProvided-conditional) and McpService
  # (McpImageProvided-conditional) — a `!Sub` referencing either
  # resource's attribute would fail template validation if that resource
  # doesn't exist, so the dashboard itself is gated on BOTH images being
  # provided, not just one.
  BothImagesProvided: !And [!Condition BackendImageProvided, !Condition McpImageProvided]
  # AWS hackathon-final pass, phase 5 (observability): gates the ADOT
  # collector sidecar/env vars below on the EnableOtelTracing opt-in.
  OtelTracingEnabled: !Equals [!Ref EnableOtelTracing, "true"]

# Spec v1.1 correction 4: "secure default must fail deployment ... when no
# cert supplied" — enforced here via CloudFormation's Rules section, which
# is evaluated (and can abort `create-stack`/`update-stack`/`sam deploy`)
# BEFORE any resource is touched, independent of the per-listener
# Conditions above (which only shape what gets created once deployment is
# already permitted to proceed). `sam validate`/`cfn-lint` do not evaluate
# Rules against a specific parameter set, so this does not block template
# validation with the (deliberately insecure-by-default-value) Parameters
# defaults above — it only blocks an actual deploy attempt that supplies
# neither a certificate nor the explicit insecure opt-in.
Rules:
  RequireTlsOrExplicitInsecureOptIn:
    RuleCondition: !Or
      - !Not [!Equals [!Ref BackendImageUri, ""]]
      - !Not [!Equals [!Ref McpServerImageUri, ""]]
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref CertificateArn, ""]]
          - !Equals [!Ref AllowInsecureDemoHttp, "true"]
        AssertDescription: >
          Deploying the backend and/or mcp_server ECS service requires
          either CertificateArn (secure HTTPS/WSS — the required default)
          or an explicit AllowInsecureDemoHttp=true opt-in for local/demo
          testing only. Refusing to deploy a public plaintext-HTTP
          endpoint by default.

  # AWS hackathon-final pass, phase 4, Gap C: "production deployment
  # supporting rolling replacement cannot silently use process-local
  # fan-out." BackendDesiredCount > 1 without a cross-instance broker
  # would silently drop WebSocket events for clients connected to a
  # different task than the one that produced them — refused at deploy
  # time, not left as a documentation-only warning. CloudFormation Rules
  # have no ">" comparison operator, so BackendDesiredCount's own
  # MinValue/MaxValue=[1,10] plus this RuleCondition's !Not[!Equals[...,"1"]]
  # is the standard pattern for expressing "> 1" here.
  BackendDesiredCountRequiresCrossInstanceBroker:
    RuleCondition: !Not [!Equals [!Ref BackendDesiredCount, "1"]]
    Assertions:
      - Assert: !Equals [!Ref EnableCrossInstanceEventBroker, "true"]
        AssertDescription: >
          BackendDesiredCount > 1 requires EnableCrossInstanceEventBroker
          =true. A multi-task backend with EVENT_BROKER=memory (the
          default) fans WebSocket events out only within the ONE task
          that produced them — a client connected to a different task
          would never receive that event at all. Set
          EnableCrossInstanceEventBroker=true (provisions the ElastiCache
          Valkey broker — see docs/adr/0001-cross-instance-event-broker.md)
          before raising BackendDesiredCount above 1.

  # AWS hackathon-final pass, phase 4, Gap A: LlmProvider=bedrock with no
  # BedrockModelArn configured would set LLM_PROVIDER=bedrock on the
  # deployed backend while granting it NO bedrock:InvokeModel IAM
  # permission at all — every real invocation would fail at runtime with
  # an AccessDenied error, discovered only once the demo is already
  # running in front of judges, rather than refused up front at deploy
  # time. The reverse (BedrockModelArn set but LlmProvider left at
  # "template") is not refused here — it is a real, if likely
  # accidental, configuration (IAM granted, unused) rather than a
  # guaranteed runtime failure, so it is left as a warning in this
  # parameter's own Description rather than a hard deploy-time refusal.
  BedrockProviderRequiresModelArn:
    RuleCondition: !Equals [!Ref LlmProvider, "bedrock"]
    Assertions:
      - Assert: !Not [!Equals [!Ref BedrockModelArn, ""]]
        AssertDescription: >
          LlmProvider=bedrock requires BedrockModelArn to also be set —
          otherwise the ECS task role is granted no bedrock:InvokeModel
          permission at all and every real Bedrock call the backend makes
          will fail at runtime with AccessDeniedException. Set
          BedrockModelArn to the ARN of the SAME model named by
          BedrockModelId.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Tracing: Active # X-Ray — spec v1.1 repair 12's tracing requirement.

Resources:
  # ---------------------------------------------------------------------
  # Data layer
  # ---------------------------------------------------------------------
  # AWS hackathon-final pass, P1-11: a dedicated customer-managed KMS key
  # for RaceStateTable's at-rest encryption, rather than the AWS-owned
  # default key DynamoDB otherwise uses silently. A customer-managed key
  # gives this stack its own auditable key policy, CloudTrail key-usage
  # events, and the ability to disable/rotate the key independently of
  # every OTHER table in the account that happens to also use SSE-KMS —
  # none of which the default AWS-owned key provides. Standard DynamoDB
  # API calls (GetItem/PutItem/Query/...) need no KMS permissions on the
  # CALLER's IAM role at all -- DynamoDB itself is granted use of this key
  # via the key policy below and handles encrypt/decrypt transparently on
  # every request, exactly as it would with the default key.
  RaceStateTableKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${AWS::StackName} RaceStateTable SSE-KMS encryption key"
      EnableKeyRotation: true # automatic annual rotation -- no application-visible effect, DynamoDB always uses the current key version transparently
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Standard root-account administrative access (key policy
          # changes, deletion scheduling, etc.) -- IAM policies still
          # additionally gate who can actually use this permission,
          # exactly like every other AWS-managed resource in this
          # template.
          - Sid: AllowRootAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # DynamoDB's own use of this key on behalf of any table backed
          # by it, scoped to this specific table's ARN via the
          # kms:CallerAccount/kms:ViaService condition pattern AWS
          # documents for DynamoDB SSE-KMS.
          - Sid: AllowDynamoDbServiceUse
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
              StringLike:
                kms:ViaService: !Sub "dynamodb.${AWS::Region}.amazonaws.com"

  RaceStateTable:
    Type: AWS::DynamoDB::Table
    # AWS hackathon-final pass, P1-11: this table holds the ONLY durable
    # copy of race state, watches/alerts, and device-pairing state once
    # STATE_REPOSITORY=dynamodb is in use (see app/config.py) -- a stack
    # deletion or a CloudFormation replacement (e.g. a future change to
    # AttributeDefinitions/KeySchema that AWS can only apply via
    # replacement) must never silently take that data with it. Retain on
    # both DeletionPolicy (stack delete) and UpdateReplacePolicy (a
    # replacement update) so the table -- and everything in it -- survives
    # either operation; an operator who genuinely wants to delete the
    # table does so as an explicit, separate action afterwards.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Spec section 18 / repair 12: enables the Watch Evaluator Lambda
      # below. NEW_IMAGE only (not NEW_AND_OLD_IMAGES) — the evaluator
      # only ever needs the new state, never a diff against the old one
      # (see watch_evaluator_stream.py's module docstring), so the
      # smaller stream record is deliberate, not an oversight.
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      # Spec v1.1 pass 4, mandatory correction 1: pairing codes and device
      # tokens (backend/app/repositories/pairing_dynamodb.py) write a
      # numeric "ttl" attribute equal to their own expires_at. This is a
      # storage-cost cleanup only — every read of a pairing/device-token
      # item re-validates expires_at/used/revoked in application code
      # BEFORE DynamoDB's (best-effort, not instantaneous) TTL sweep ever
      # runs, so correctness never depends on TTL deletion timing; it only
      # keeps the table from accumulating expired rows forever. No other
      # item type in this table currently sets "ttl", so this has no
      # effect on race-state/watch/alert items.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      # AWS hackathon-final pass, P1-11: continuous backups (35-day
      # point-in-time recovery window) -- the ONLY way to recover from an
      # accidental/buggy application-level write or delete (a bad
      # deploy's migration, an operator's mistaken `aws dynamodb
      # delete-item`), as opposed to an AZ/region failure, which
      # DynamoDB's own multi-AZ replication already handles regardless of
      # this setting. See docs/deployment-runbook.md's "Backup and
      # restoration" section for the actual restore procedure/RTO/RPO.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Explicit customer-managed KMS encryption (RaceStateTableKey
      # above) rather than relying on the AWS-owned default key's
      # implicit (and, prior to this pass, entirely unstated in this
      # template) encryption -- see that resource's own comment for why
      # a customer-managed key is preferred here.
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref RaceStateTableKey

  # Alerts already carry their own immutable triggering_snapshot (spec 49)
  # — that field already constitutes the "historical state" a real
  # deployment needs (see Alert in app/domain/watch_models.py); no
  # separate historical-state table is provisioned here, on purpose.

  RaceStateTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-race-state-table-throttled"
      AlarmDescription: >
        AWS hackathon-final pass, P1-11: fires when RaceStateTable
        throttles ANY read or write request over a 5-minute window. This
        table is PAY_PER_REQUEST (on-demand) -- throttling here means
        DynamoDB's own automatic capacity scaling has not kept up with a
        genuine traffic spike (on-demand tables can still throttle
        briefly immediately after a sudden large increase — see AWS's
        own on-demand scaling documentation), not a capacity limit an
        operator forgot to raise.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RaceStateTableSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-race-state-table-system-errors"
      AlarmDescription: >
        AWS hackathon-final pass, P1-11: fires on any DynamoDB-side
        (5xx-equivalent) SystemErrors against RaceStateTable over a
        5-minute window -- distinct from ThrottledRequests above (client
        -side 4xx-equivalent, caused by request volume) and from any
        error this application's own code raises; this is specifically
        DynamoDB itself failing a request it should have served.
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DemoAccessTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/demo-access-token"
      Description: >
        Spec v1.1 repair 11's shared-secret check on mutating backend
        endpoints (DEMO_ACCESS_TOKEN). Generated here, at stack-create
        time, by Secrets Manager itself — this value never appears in the
        template, a parameter, or stack events/CloudTrail in plaintext.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  McpAccessTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/mcp-access-token"
      Description: >
        Spec v1.1 correction 3: bearer token required on the internet-
        facing MCP ALB's /mcp endpoint (mcp_server/server.py's
        _AuthMiddleware). Generated here, independently of
        DemoAccessTokenSecret above — the MCP inbound access token must
        NEVER reuse the backend's mutation/demo token (a caller who only
        has one of the two must not be able to use it as the other).
        Never rendered in plaintext in this template, a parameter, or
        stack events/CloudTrail.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  # ---------------------------------------------------------------------
  # Watch Evaluator Lambda (spec section 18 / repair 12) — DynamoDB
  # Streams -> WatchEvaluator.evaluate(), exactly mirroring the in-process
  # hook app/main.py already wires for the single-process demo. See
  # backend/app/lambda_handlers/watch_evaluator_stream.py's own module
  # docstring for the full trigger/idempotency/failure-handling contract,
  # and infrastructure/lambda/watch_evaluator_stream/Makefile for why this
  # function needs a Makefile build (it packages backend/app + scenarios/
  # directly, rather than a second, duplicate copy of that code).
  # ---------------------------------------------------------------------
  WatchEvaluatorStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watch-evaluator-stream"
      Handler: app.lambda_handlers.watch_evaluator_stream.handler
      CodeUri: lambda/watch_evaluator_stream/
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableName
          LOG_LEVEL: INFO
          # app/config.py's DEFAULT_SCENARIO_PATH is derived as
          # "two directories above app/config.py" — correct for the
          # long-running backend's layout (backend/app/config.py ->
          # repo root), but WRONG here: this function's Makefile (see
          # infrastructure/lambda/watch_evaluator_stream/Makefile) places
          # app/ directly at the Lambda package root alongside scenarios/,
          # not nested under a backend/ directory, so that derivation
          # would land one level too high. Lambda always extracts the
          # deployment package to /var/task, so this is set explicitly
          # rather than relying on that derivation for a layout it wasn't
          # written for — confirmed correct by running the packaged
          # handler directly against `sam build`'s own output (see
          # docs/deployment-runbook.md).
          SCENARIO_PATH: /var/task/scenarios/scenario-demo-01.json
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RaceStateTable
        # DynamoDBCrudPolicy already includes the table-level stream read
        # actions (DescribeStream/GetRecords/GetShardIterator/ListStreams)
        # this function's own event-source mapping needs — no separate
        # policy statement required for that half.
        #
        # DynamoDBCrudPolicy does NOT include dynamodb:TransactWriteItems
        # (confirmed against AWS's own policy-template definition — it
        # only covers GetItem/PutItem/DeleteItem/Query/Scan/UpdateItem/
        # Batch*/DescribeTable/ConditionCheckItem), so it is granted here
        # explicitly. Spec v1.1 correction 9:
        # DynamoDBTransitionWriter (backend/app/repositories/
        # watch_dynamodb.py), which THIS function's WatchEvaluator uses
        # for every status-changing evaluation, commits the alert
        # idempotency marker, the alert item, and the watch update in one
        # TransactWriteItems call.
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt RaceStateTable.Arn
    Metadata:
      BuildMethod: makefile

  WatchEvaluatorStreamDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watch-evaluator-stream-dlq"
      MessageRetentionPeriod: 1209600 # 14 days — max retention, for later inspection.

  WatchEvaluatorStreamDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WatchEvaluatorStreamDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt WatchEvaluatorStreamDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt WatchEvaluatorStreamFunction.Arn

  WatchEvaluatorStreamEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RaceStateTable.StreamArn
      FunctionName: !Ref WatchEvaluatorStreamFunction
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1 # keep alerts near-real-time, per spec's own <1s target
      MaximumRetryAttempts: 3
      # Spec v1.1 correction 10 review: without this, a record that keeps
      # failing retries indefinitely (up to the stream's own 24h
      # retention) before MaximumRetryAttempts/BisectBatchOnFunctionError
      # ever gets it to the DLQ below, directly contradicting this
      # mapping's own "keep alerts near-real-time" intent. 1 hour is far
      # more than any transient AWS-side failure needs to clear, while
      # still failing a genuinely broken record over to the DLQ promptly
      # instead of retrying it for a full day.
      MaximumRecordAgeInSeconds: 3600
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt WatchEvaluatorStreamDeadLetterQueue.Arn
      # Spec 18 only ever cares about STATE-item writes (see
      # watch_evaluator_stream.py's module docstring) — this filter keeps
      # CONTROL-item writes (reset/demo-control state) from invoking the
      # function at all, rather than invoking it and having the handler
      # discard them itself (both are correct; filtering at the source is
      # strictly cheaper).
      FilterCriteria:
        Filters:
          - Pattern: '{"dynamodb":{"NewImage":{"sk":{"S":["STATE"]}}}}'

  WatchEvaluatorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-watch-evaluator-errors"
      AlarmDescription: >
        Fires if the Watch Evaluator Lambda raises on any invocation over
        a 5-minute window — a real metric/alarm per spec v1.1 repair 12,
        not a placeholder. (The handler itself swallows per-record
        evaluation errors — see its module docstring — so an error metric
        here means the handler's own top-level code, not one bad record,
        failed.)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WatchEvaluatorStreamFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------
  # Legacy Alexa Skill Lambda (legacy/alexa_skill_legacy_rest/) — kept
  # deployable as the explicitly-optional fallback (spec v1.1 repair 10),
  # never the primary Alexa+ integration (that's alexa_plus_client/ +
  # mcp_server's ECS service below, which needs no Lambda of its own).
  # ---------------------------------------------------------------------
  AlexaSkillLegacyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-alexa-skill-legacy"
      Handler: lambda_function.handler
      CodeUri: ../legacy/alexa_skill_legacy_rest/lambda/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          # Spec v1.1 correction 10: no `REPLACE-ME`-style placeholder
          # runtime value in any deployable resource. When the backend
          # hasn't been deployed yet (BackendImageUri left blank), this is
          # left genuinely EMPTY rather than a fake-but-plausible hostname
          # that could silently end up dereferenced by real traffic — an
          # empty base URL fails loudly and obviously the moment this
          # Lambda is actually invoked, instead of quietly resolving to
          # some placeholder domain nobody owns.
          PIT_WALL_API_BASE_URL: !If
            - BackendImageProvided
            - !Sub
              - "${Scheme}://${DnsName}"
              - Scheme: !If [HasCertificate, "https", "http"]
                DnsName: !GetAtt BackendLoadBalancer.DNSName
            - ""
          PIT_WALL_RACE_ID: !Ref RaceId
          # Resolved directly from Secrets Manager at deploy time — this
          # dynamic reference is never rendered in plaintext anywhere in
          # the template itself (spec v1.1 repair 11's "no production
          # credential in source/templates/docs" extends naturally to
          # this file too).
          PIT_WALL_DEMO_ACCESS_TOKEN: !Sub "{{resolve:secretsmanager:${DemoAccessTokenSecret}}}"
      # No DynamoDB permissions here on purpose (see the pre-existing
      # comment this carries forward): this Lambda is a thin HTTP adapter
      # over the backend's REST API — it never touches DynamoDB directly.

  # ---------------------------------------------------------------------
  # Shared networking building blocks for the two ECS Fargate services.
  # ---------------------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-backend"
      RetentionInDays: 30

  McpServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-mcp-server"
      RetentionInDays: 30

  # ---------------------------------------------------------------------
  # Backend service (FastAPI + native WebSocket) — ALB with WS pass-
  # through to Fargate. See the module docstring at the top of this file
  # for why ALB, not API Gateway WebSocket.
  # ---------------------------------------------------------------------
  BackendAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} backend ALB - inbound HTTP/HTTPS from the internet"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - !If
          - HasCertificate
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue

  BackendServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} backend Fargate tasks - inbound only from the backend ALB"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref BackendAlbSecurityGroup

  # AWS hackathon-final pass, P0-3: shared cross-instance event bus for
  # WebSocket fan-out (see app/services/event_broker.py and
  # docs/adr/0001-cross-instance-event-broker.md). Only created when
  # EnableCrossInstanceEventBroker=true — a single-task demo deployment
  # (this template's own DesiredCount: 1 default) has no cross-instance
  # problem to solve and pays nothing extra by default.
  EventBrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CrossInstanceEventBrokerEnabled
    Properties:
      GroupDescription: !Sub "${AWS::StackName} ElastiCache Serverless cache - inbound only from backend tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref BackendServiceSecurityGroup

  EventBrokerCache:
    Type: AWS::ElastiCache::ServerlessCache
    Condition: CrossInstanceEventBrokerEnabled
    Properties:
      ServerlessCacheName: !Sub "${AWS::StackName}-events"
      Engine: valkey
      # Demo/hackathon-scale ceiling — bounds cost while still supporting
      # far more throughput than a 4-car demo's event volume needs. A
      # real production deployment would size this from observed
      # CloudWatch usage (see docs/adr/0001-cross-instance-event-broker.md's
      # cost section) rather than this template's own placeholder value.
      CacheUsageLimits:
        DataStorage:
          Maximum: 1
          Unit: GB
        ECPUPerSecond:
          Maximum: 5000
      SecurityGroupIds:
        - !Ref EventBrokerSecurityGroup
      SubnetIds: !Ref SubnetIds

  BackendLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-backend"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref BackendAlbSecurityGroup

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-backend-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      # Spec v1.1 correction 10 review: the 300s CloudFormation default
      # would make every rolling deploy/rollback wait 5 minutes per
      # replaced task for no benefit in a demo stack with no sticky
      # long-lived connections that need draining slowly — 30s is enough
      # for an in-flight request/short-lived WebSocket to finish cleanly.
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      # ALB target groups pass a WebSocket Upgrade request straight
      # through to the target once the initial HTTP health check and
      # routing match — no separate WebSocket-specific target-group
      # setting exists or is needed.

  BackendHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BackendLoadBalancer
      Port: 80
      Protocol: HTTP
      # Spec v1.1 correction 4: when TLS is configured, :80 always
      # redirects to :443 (never serves plaintext). When TLS is NOT
      # configured, plain HTTP forwarding here is reachable only in a
      # deploy that the Rules section above has already required to pass
      # AllowInsecureDemoHttp=true explicitly — this DefaultActions block
      # itself still needs to resolve to *something* structurally valid
      # for template validation, so it forwards under that same condition
      # rather than referencing the Rules-section opt-in a second, looser
      # way here.
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref BackendTargetGroup

  BackendHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref BackendLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      # Spec v1.1 correction 2: ECS retrieves task-definition `Secrets`
      # (below, on BackendTaskDefinition's DEMO_ACCESS_TOKEN) using the
      # EXECUTION role, not the task role — the execution role is what the
      # ECS agent itself assumes to pull the image, write logs, AND
      # resolve `Secrets`/`Environment` values BEFORE the container's own
      # process ever starts. Granting this on the task role (the
      # pre-correction state) does nothing for that resolution step; it
      # only happened to work in the sense that the running application
      # could ALSO independently call secretsmanager:GetSecretValue itself
      # if it chose to — which this app does not do (it reads
      # DEMO_ACCESS_TOKEN from its own process environment, already
      # populated by ECS via the execution role). Scoped to the exact
      # secret ARN, never secretsmanager:* (least privilege).
      Policies:
        - PolicyName: DemoAccessTokenRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DemoAccessTokenSecret

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Runtime application permissions ONLY — the secret-read grant that
      # used to live here has moved to BackendTaskExecutionRole above (see
      # its comment); this role no longer needs, and no longer has, any
      # secretsmanager:* permission of its own (spec v1.1 correction 2:
      # "keep app runtime permissions on task roles").
      Policies:
        - PolicyName: DynamoDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  # Spec v1.1 pass 4, mandatory correction 1:
                  # backend/app/repositories/pairing_dynamodb.py's atomic,
                  # conditional pairing-code consumption
                  # (try_consume_code), device-token revocation
                  # (revoke_token/revoke_by_device_id), and the
                  # distributed pairing-rate-limit counter
                  # (DynamoDBPairingRateLimiter) all use a conditional
                  # UpdateItem — least-privilege addition, same table, no
                  # new resource to scope.
                  - dynamodb:UpdateItem
                  # Spec v1.1 correction 9: DynamoDBTransitionWriter
                  # (backend/app/repositories/watch_dynamodb.py) commits
                  # the alert idempotency marker, the alert item, and the
                  # watch update in one TransactWriteItems call so a
                  # process crash between the old two-step
                  # record_transition()+update_watch() writes can no
                  # longer leave a committed alert behind a stale watch —
                  # see that module's DynamoDBTransitionWriter class
                  # docstring for the full rationale. Also used by
                  # backend/app/repositories/pairing_dynamodb.py's
                  # DynamoDBDeviceTokenRepository.create_token (pass 4,
                  # correction 1) to write the device-token item and its
                  # device_id index item atomically.
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt RaceStateTable.Arn
        - PolicyName: XRayWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                # AWS hackathon-final pass, phase 5: every container in
                # BackendTaskDefinition shares this one TaskRoleArn (ECS
                # does not grant per-container IAM within a task), so this
                # same grant already covers the otel-collector sidecar's
                # `awsxray` exporter below — no separate policy needed.
                Resource: "*" # X-Ray write actions do not support resource-level scoping.
        - !If
          - HasBedrockModel
          - PolicyName: BedrockInvoke
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Ref BedrockModelArn
          - !Ref AWS::NoValue

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: BackendImageProvided
    Properties:
      Family: !Sub "${AWS::StackName}-backend"
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt BackendTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      # Spec v1.1 pass 4, mandatory correction 8: "read-only filesystems/
      # dropped capabilities where compatible." The backend never writes
      # to its own container filesystem at runtime (all durable state is
      # DynamoDB — see STATE_REPOSITORY=dynamodb above; logs go to stdout,
      # captured by the awslogs driver below) except for the ordinary
      # ephemeral scratch space some libraries (tempfile, some C
      # extensions) expect at /tmp — so the root filesystem is made
      # read-only and only /tmp is given a small writable, ephemeral
      # volume, rather than leaving the whole container filesystem
      # writable for no application reason.
      Volumes:
        - Name: tmp
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities:
              Drop:
                - ALL
          MountPoints:
            - SourceVolume: tmp
              ContainerPath: /tmp
          # Bounds how long ECS waits for uvicorn's own graceful shutdown
          # (see backend/Dockerfile's `--timeout-graceful-shutdown 25`)
          # before sending SIGKILL — slightly above that 25s so a clean
          # shutdown is never cut off mid-drain.
          StopTimeout: 30
          PortMappings:
            - ContainerPort: 8000
          Environment:
            # AWS hackathon-final pass, P0-2: the backend's own fail-closed
            # production validation (see backend/app/config.py's
            # Settings.environment / production-mode secret checks) is
            # gated entirely on ENVIRONMENT=="production", but nothing in
            # this template ever set that value in the deployed ECS task —
            # so every real AWS deployment was silently running with the
            # (looser) non-production validation path, regardless of how
            # production-like the rest of the infrastructure looked. This
            # is the fix: every backend task ECS actually runs is now
            # unambiguously told it is the production environment, so the
            # app-layer fail-closed checks (required secrets present,
            # DEMO_ACCESS_TOKEN not empty, CORS not left wide open, etc.)
            # are actually exercised in the deployed stack, not just in
            # local/test config. See infrastructure/tests/test_template_security.py
            # for the accompanying infra test, and backend/tests/test_config.py /
            # test_observability.py for the app-side fail-closed behavior
            # this value activates.
            - Name: ENVIRONMENT
              Value: production
            - Name: STATE_REPOSITORY
              Value: dynamodb
            - Name: DYNAMODB_TABLE_NAME
              Value: !Ref TableName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_XRAY_DAEMON_ADDRESS
              Value: 127.0.0.1:2000
            # AWS hackathon-final pass, P0-3: EVENT_BROKER stays "memory"
            # (app/config.py's own default) whenever
            # EnableCrossInstanceEventBroker=false — an intentional,
            # explicit choice, not an omission: this deployment is only
            # ever running DesiredCount: 1, so no cross-instance broker is
            # needed and none is provisioned. Flip
            # EnableCrossInstanceEventBroker=true (which provisions
            # EventBrokerCache above) before raising DesiredCount past 1.
            - Name: EVENT_BROKER
              Value: !If [CrossInstanceEventBrokerEnabled, redis, memory]
            - Name: REDIS_URL
              Value: !If
                - CrossInstanceEventBrokerEnabled
                - !Sub "rediss://${EventBrokerCache.Endpoint.Address}:${EventBrokerCache.Endpoint.Port}"
                - ""
            # AWS hackathon-final pass, phase 4, Gap A: actually activates
            # Bedrock (or the deterministic fallback) in the deployed
            # task — see the LlmProvider/BedrockModelId/BedrockRegion
            # parameters' own descriptions above for what this fixes
            # (previously: IAM was granted but LLM_PROVIDER was never set,
            # so the deployed backend always ran the template narrator
            # regardless of BedrockModelArn). LlmProvider=bedrock without
            # BedrockModelArn is refused at deploy time by the
            # BedrockProviderRequiresModelArn Rule above, so this value
            # only ever reaches the container in a state where the IAM
            # grant above (HasBedrockModel) also actually exists.
            - Name: LLM_PROVIDER
              Value: !Ref LlmProvider
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: BEDROCK_REGION
              Value: !Ref BedrockRegion
            # AWS hackathon-final pass, phase 4, Gap B: actually activates
            # trusted-proxy X-Forwarded-For handling in the deployed task
            # — see the TrustedProxyCidrs parameter's own description
            # above for what this fixes (previously: TRUSTED_PROXY_CIDRS
            # was never set in any deployed environment, so
            # get_client_ip's per-real-client rate-limit buckets, and
            # audit-log client_host fields, always fell back to the ALB's
            # own single peer address for every request in every real
            # deployment). Blank (the default) preserves that pre-phase-4
            # behavior exactly — no new trust is granted unless the
            # deployer explicitly supplies a CIDR.
            - Name: TRUSTED_PROXY_CIDRS
              Value: !Ref TrustedProxyCidrs
            # AWS hackathon-final pass, phase 5 (observability): activates
            # the backend's own OTel SDK wiring (backend/app/tracing.py)
            # in the deployed task, and points it at the ADOT collector
            # sidecar below, only when EnableOtelTracing=true. See that
            # parameter's own description for the full rationale — left
            # "false" the backend's OTel SDK stays a documented no-op,
            # exactly like its default in app/config.py.
            - Name: OTEL_TRACING_ENABLED
              Value: !If [OtelTracingEnabled, "true", "false"]
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT
              Value: "http://127.0.0.1:4318"
            - Name: OTEL_SERVICE_NAME
              Value: !Sub "${AWS::StackName}-backend"
            # Repair pass (operational correction: production trace
            # sampling). Standard OpenTelemetry env vars, read directly by
            # the SDK's own `sampling._get_from_env_or_default()` since
            # backend/app/tracing.py's TracerProvider construction pins no
            # explicit `sampler=` argument. Only meaningful when
            # OTEL_TRACING_ENABLED=true above; harmless (unread) otherwise.
            # See OtelTracesSampler/OtelTracesSamplerArg parameters' own
            # descriptions above for the full rationale.
            - Name: OTEL_TRACES_SAMPLER
              Value: !Ref OtelTracesSampler
            - Name: OTEL_TRACES_SAMPLER_ARG
              Value: !Ref OtelTracesSamplerArg
          Secrets:
            - Name: DEMO_ACCESS_TOKEN
              ValueFrom: !Ref DemoAccessTokenSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
        # X-Ray daemon sidecar — repair 12's tracing requirement applied
        # to the ECS half (Lambdas get it for free via Globals.Function's
        # Tracing: Active above; a container task needs its own daemon).
        - Name: xray-daemon
          # Spec v1.1 pass 4, mandatory correction 8: "avoid `latest` tags
          # for prod sidecars." Pinned to a specific, released version
          # (3.3.14, the latest stable tag as of this pass) instead of the
          # floating `:latest`, which would otherwise silently pull a
          # different daemon build on every fresh task placement/AZ
          # rebalance with no corresponding change to this template.
          Image: !Ref XRayDaemonImage
          Essential: false
          # Deliberately NOT given ReadonlyRootFilesystem/dropped
          # capabilities like the backend container above: this is a
          # third-party vendor image (not this repository's own code) and
          # its own internal buffering/temp-file behavior has not been
          # audited here — "where compatible" (correction 8's own
          # phrasing) is judged not to cover an unaudited vendor image.
          # The backend's own task role already grants it only the two
          # narrow xray:Put* actions it needs (see BackendTaskRole above),
          # which is the hardening that IS applied to this sidecar.
          PortMappings:
            - ContainerPort: 2000
              Protocol: udp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: xray
        # AWS hackathon-final pass, phase 5 (observability): ADOT
        # collector sidecar. Always provisioned (see EnableOtelTracing's
        # own description above for why), receives OTLP/HTTP spans from
        # the backend container on 4318 and re-exports them to X-Ray. Its
        # own config is embedded as a literal `--config=` command
        # argument (an inline YAML document, not a file this task reads
        # from anywhere) so no additional volume/config-file provisioning
        # is needed beyond this one container definition.
        - Name: otel-collector
          Image: !Ref OTelCollectorImage
          Essential: false
          PortMappings:
            - ContainerPort: 4318
              Protocol: tcp
          Command:
            - !Sub "--config=receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nexporters:\n  awsxray:\n    region: ${AWS::Region}\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      exporters: [awsxray]\n"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: otel-collector

  BackendService:
    Type: AWS::ECS::Service
    Condition: BackendImageProvided
    DependsOn:
      - BackendHttpListener
    Properties:
      ServiceName: !Sub "${AWS::StackName}-backend"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref BackendTaskDefinition
      # Spec v1.1 pass 4, mandatory correction 8: "the backend must safely
      # run more than one task" — already true at the application layer
      # (STATE_REPOSITORY=dynamodb + PAIRING_REPOSITORY mirroring it means
      # race state, watches, alerts, pairing codes and device tokens are
      # all shared/consistent across every task — see pass 4 correction 1
      # and the pre-existing Gate 2 watch/alert DynamoDB repositories).
      # AWS hackathon-final pass, phase 4, Gap C: DesiredCount is now the
      # BackendDesiredCount parameter (default 1, this template's own
      # demo-scale default — a real production deployment would raise
      # this, see EXTERNAL_RELEASE_CHECKLIST.md), no longer hardcoded —
      # see that parameter's own description for the
      # cross-instance-broker requirement enforced above it whenever it
      # is raised past 1. The deployment configuration below was already
      # written to be correct for either count: a rolling deployment with
      # DesiredCount: 1 briefly runs 2 tasks (200% max, 100% min-healthy
      # — never zero capacity mid-deploy) exactly the same way it would
      # with any larger DesiredCount.
      DesiredCount: !Ref BackendDesiredCount
      # Spec v1.1 pass 4, mandatory correction 8: "ECS deployment health
      # percentages, rollback/circuit breaker." Previously unset (falling
      # back to ECS's own defaults, which do NOT include the deployment
      # circuit breaker) — an image that starts but immediately fails its
      # ALB health check would sit "successfully deployed" from ECS's
      # perspective while the target group serves 5xx to real traffic. The
      # circuit breaker below detects a deployment that cannot reach a
      # steady state and rolls the service back to the last known-good
      # task definition automatically, without a person watching.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref BackendServiceSecurityGroup
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref BackendTargetGroup

  BackendUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: BackendImageProvided
    Properties:
      AlarmName: !Sub "${AWS::StackName}-backend-unhealthy-hosts"
      AlarmDescription: Fires when the backend ALB target group has at least one unhealthy target.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt BackendLoadBalancer.LoadBalancerFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------
  # mcp_server service (Streamable HTTP MCP transport — server.py) — the
  # other, separate ALB + Fargate service the primary Alexa+ integration
  # (alexa_plus_client/) talks to once deployed. Same shape as the
  # backend service above; kept as its own ALB rather than path-routed
  # behind the backend's, for the same "simpler to reason about than
  # clever" reasoning already applied to keeping alexa_plus_client/ and
  # legacy/alexa_skill_legacy_rest/ as two separate packages.
  # ---------------------------------------------------------------------
  McpAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} mcp server ALB - inbound HTTP/HTTPS from the internet"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - !If
          - HasCertificate
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue

  McpServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} mcp server Fargate tasks - inbound only from the mcp server ALB"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9000
          ToPort: 9000
          SourceSecurityGroupId: !Ref McpAlbSecurityGroup

  McpLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-mcp"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref McpAlbSecurityGroup

  McpTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-mcp-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 9000
      TargetType: ip
      HealthCheckPath: /health
      # Matches BackendTargetGroup's own interval/deregistration settings
      # (spec v1.1 correction 10 review) — was previously left at the
      # CloudFormation defaults (30s interval, 300s deregistration delay),
      # inconsistent with the backend's tuned values for no reason.
      HealthCheckIntervalSeconds: 15
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  McpHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref McpLoadBalancer
      Port: 80
      Protocol: HTTP
      # See BackendHttpListener's comment above — same
      # secure-default-via-Rules-section reasoning applies here.
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref McpTargetGroup

  McpHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref McpLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref McpTargetGroup

  McpTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      # Spec v1.1 corrections 2 + 3: same execution-role-resolves-Secrets
      # reasoning as BackendTaskExecutionRole above. Grants read access to
      # BOTH secrets referenced in McpTaskDefinition's `Secrets` list
      # below (PIT_WALL_DEMO_ACCESS_TOKEN — used by mcp_server to call the
      # backend's mutating endpoints on the caller's behalf — and
      # PIT_WALL_MCP_ACCESS_TOKEN — the inbound bearer token this
      # service's own /mcp endpoint requires), each scoped to its own
      # exact secret ARN, never secretsmanager:*.
      Policies:
        - PolicyName: SecretsRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DemoAccessTokenSecret
                  - !Ref McpAccessTokenSecret

  McpTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # mcp_server's 5 domain tools call the backend's own REST/MCP
      # -adjacent HTTP surface (see mcp_server/server.py) — it never
      # touches DynamoDB directly at runtime; the DEMO_ACCESS_TOKEN/
      # MCP_ACCESS_TOKEN values it needs are handed to it already
      # -resolved, as container environment variables, by the execution
      # role above (spec v1.1 correction 2: "keep app runtime permissions
      # on task roles"). Repair pass, mandatory correction 4: this task
      # role now ALSO grants the same narrow xray:Put* actions
      # BackendTaskRole grants — see the XRayWrite policy below — because
      # mcp_server/tracing.py's ADOT collector sidecar (see the
      # otel-collector container below) genuinely needs it now, closing
      # the asymmetry a previous pass's comment here honestly flagged as
      # real but harmless (at the time, correct: no code in either
      # service instrumented tracing yet — this pass is what changes
      # that for mcp_server specifically, see tracing.py's own module
      # docstring).
      Policies:
        - PolicyName: XRayWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                # Every container in McpTaskDefinition shares this one
                # TaskRoleArn (ECS does not grant per-container IAM
                # within a task), so this same grant covers the
                # otel-collector sidecar's `awsxray` exporter below — same
                # reasoning as BackendTaskRole's matching policy.
                Resource: "*" # X-Ray write actions do not support resource-level scoping.

  McpTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: McpImageProvided
    Properties:
      Family: !Sub "${AWS::StackName}-mcp-server"
      # Repair pass, mandatory correction 4: bumped from 256/512 (this
      # task's pre-tracing size) to match the CPU/memory the
      # otel-collector sidecar needs alongside the main container — the
      # same image, at the same size, BackendTaskDefinition already runs
      # successfully at 512/1024 (this task has no xray-daemon sidecar,
      # so it needs less headroom than the backend's 512/1024 despite
      # adding the same collector).
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt McpTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt McpTaskRole.Arn
      # Spec v1.1 pass 4, mandatory correction 8: same reasoning as
      # BackendTaskDefinition's own Volumes/ReadonlyRootFilesystem comment
      # above — mcp_server never writes to its own container filesystem
      # (it is a thin HTTP adapter over the backend's REST API — see
      # McpTaskRole's own comment) except ordinary /tmp scratch space.
      Volumes:
        - Name: tmp
      ContainerDefinitions:
        - Name: mcp-server
          Image: !Ref McpServerImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities:
              Drop:
                - ALL
          MountPoints:
            - SourceVolume: tmp
              ContainerPath: /tmp
          # See BackendTaskDefinition's matching StopTimeout comment —
          # server.py's own uvicorn.run(..., timeout_graceful_shutdown=25).
          StopTimeout: 30
          PortMappings:
            - ContainerPort: 9000
          Environment:
            - Name: PIT_WALL_MCP_HOST
              Value: "0.0.0.0"
            - Name: PIT_WALL_MCP_PORT
              Value: "9000"
            - Name: PIT_WALL_API_BASE_URL
              # Spec v1.1 correction 10: no REPLACE-ME-style placeholder —
              # see AlexaSkillLegacyFunction's matching comment above for
              # why an empty value is used instead when the backend hasn't
              # been deployed yet.
              Value: !If
                - BackendImageProvided
                - !Sub
                  - "${Scheme}://${DnsName}"
                  - Scheme: !If [HasCertificate, "https", "http"]
                    DnsName: !GetAtt BackendLoadBalancer.DNSName
                - ""
              # No PIT_WALL_RACE_ID here: unlike the legacy Alexa Lambda
              # (which hardcodes the one race it talks about per
              # deployment), mcp_server's tools all take race_id as a
              # per-call argument (see server.py's get_race_state,
              # calculate_undercut, etc.) — there is no server-level
              # "current race" setting for it to read.
            # Repair pass, mandatory correction 4: activates
            # mcp_server/tracing.py's OTel SDK wiring in the deployed
            # task, and points it at THIS task's own ADOT collector
            # sidecar below — same EnableOtelTracing opt-in and same
            # OtelTracingEnabled condition BackendTaskDefinition's
            # matching env vars use, so both services are enabled/
            # disabled together by one parameter. Left "false" (the
            # default), mcp_server's OTel SDK wiring stays a documented
            # no-op, exactly matching tracing.py's own disabled-by
            # -default contract.
            - Name: PIT_WALL_MCP_OTEL_TRACING_ENABLED
              Value: !If [OtelTracingEnabled, "true", "false"]
            - Name: PIT_WALL_MCP_OTEL_EXPORTER_OTLP_ENDPOINT
              Value: "http://127.0.0.1:4318"
            - Name: PIT_WALL_MCP_OTEL_SERVICE_NAME
              Value: !Sub "${AWS::StackName}-mcp-server"
            # Repair pass (operational correction: production trace
            # sampling). Standard (unprefixed) OpenTelemetry env vars — read
            # directly by the OTel SDK's own
            # `sampling._get_from_env_or_default()`, not by mcp_server's own
            # `PIT_WALL_MCP_*`-prefixed os.environ.get convention, since
            # mcp_server/tracing.py's TracerProvider construction pins no
            # explicit `sampler=` argument either (mirrors
            # backend/app/tracing.py — see that task definition's matching
            # env vars above and the OtelTracesSampler/OtelTracesSamplerArg
            # parameters' own descriptions). Only meaningful when
            # PIT_WALL_MCP_OTEL_TRACING_ENABLED=true above; harmless
            # (unread) otherwise.
            - Name: OTEL_TRACES_SAMPLER
              Value: !Ref OtelTracesSampler
            - Name: OTEL_TRACES_SAMPLER_ARG
              Value: !Ref OtelTracesSamplerArg
          Secrets:
            - Name: PIT_WALL_DEMO_ACCESS_TOKEN
              ValueFrom: !Ref DemoAccessTokenSecret
            # Spec v1.1 correction 3: this ALB is internet-facing, so the
            # /mcp endpoint MUST require its own bearer token — a
            # dedicated secret (McpAccessTokenSecret, above), never a
            # reuse of PIT_WALL_DEMO_ACCESS_TOKEN. mcp_server/server.py's
            # _AuthMiddleware reads this env var and rejects any request
            # (401) whose Authorization header doesn't present it via a
            # constant-time comparison — see that module's docstring.
            - Name: PIT_WALL_MCP_ACCESS_TOKEN
              ValueFrom: !Ref McpAccessTokenSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref McpServerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mcp-server
        # Repair pass, mandatory correction 4: ADOT collector sidecar,
        # identical in design to BackendTaskDefinition's own
        # otel-collector container above (same image parameter, same
        # inline OTLP-\>awsxray pipeline config, always provisioned —
        # idle and harmless when EnableOtelTracing=false, exactly like
        # that one) — receives OTLP/HTTP spans from the mcp-server
        # container on 4318 and re-exports them to X-Ray, closing the gap
        # `JUDGING_EVIDENCE.md` (removed in the repo cleanup; see git history)/AWS_ARCHITECTURE.md previously described
        # inaccurately (both services now genuinely have this wired, not
        # just the backend).
        - Name: otel-collector
          Image: !Ref OTelCollectorImage
          Essential: false
          PortMappings:
            - ContainerPort: 4318
              Protocol: tcp
          Command:
            - !Sub "--config=receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nexporters:\n  awsxray:\n    region: ${AWS::Region}\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      exporters: [awsxray]\n"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref McpServerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: otel-collector

  McpService:
    Type: AWS::ECS::Service
    Condition: McpImageProvided
    DependsOn:
      - McpHttpListener
    Properties:
      ServiceName: !Sub "${AWS::StackName}-mcp-server"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref McpTaskDefinition
      DesiredCount: 1
      # Spec v1.1 pass 4, mandatory correction 8: same deployment circuit
      # breaker/rollback/health-percentage reasoning as BackendService
      # above — mcp_server holds no per-instance state of its own (every
      # tool call is a stateless HTTP round trip to the backend), so this
      # is even more straightforwardly safe to roll out this way than the
      # backend service.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref McpServiceSecurityGroup
      LoadBalancers:
        - ContainerName: mcp-server
          ContainerPort: 9000
          TargetGroupArn: !Ref McpTargetGroup

  # ---------------------------------------------------------------------
  # WAF rate limiting (spec v1.1 repair 12) — one WebACL, associated with
  # both ALBs, rate-limiting by source IP. This is on the ALBs rather than
  # per-route because neither ALB fronts an API Gateway (see the module
  # docstring's ALB-vs-API-Gateway-WebSocket reasoning) — WAF's regional
  # ALB association is the equivalent control point here.
  # ---------------------------------------------------------------------
  RateLimitWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-rate-limit"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}RateLimit"
      Rules:
        # AWS hackathon-final pass, P1-10: a SEPARATE, much tighter
        # rate-based rule scoped (via ScopeDownStatement) to only the
        # device-pairing endpoints (/v1/auth/pairing-codes, /v1/auth/pair,
        # /v1/auth/revoke) — spec v1.1 pass 3 correction 5's own named
        # scenario is exactly pairing-code brute-forcing, which the
        # general 2000-req/5min site-wide rule below is far too loose to
        # meaningfully bound (an attacker could burn most of that budget
        # on pairing-code guesses alone while everything else on the same
        # IP still looks nominal). Evaluated at a LOWER Priority number
        # than RateLimitPerIp, so WAF checks it first for every request;
        # WAF rule evaluation does not stop at the first non-matching
        # rule, so a request that clears this rule still falls through to
        # RateLimitPerIp's site-wide budget as well. This is a coarser,
        # earlier line of defense than the application-layer
        # trusted-proxy-aware PairingRateLimiter (app/services/
        # device_pairing.py / app/repositories/pairing_dynamodb.py) — the
        # two are complementary, not redundant: WAF blocks at the edge
        # before the request ever reaches a Fargate task; the app-layer
        # limiter additionally distinguishes rate-limited (429) from
        # invalid-code (401) outcomes and emits the audit/metric events
        # PairingFailuresAlarm and PairingThrottlingAlarm below alert on.
        - Name: PairingEndpointRateLimit
          Priority: 0
          Statement:
            RateBasedStatement:
              Limit: 60 # requests per 5-minute sliding window per source IP, pairing endpoints only
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        SearchString: /v1/auth/pairing-codes
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                        PositionalConstraint: STARTS_WITH
                    - ByteMatchStatement:
                        SearchString: /v1/auth/pair
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                        PositionalConstraint: STARTS_WITH
                    - ByteMatchStatement:
                        SearchString: /v1/auth/revoke
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                        PositionalConstraint: STARTS_WITH
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}PairingEndpointRateLimit"
        - Name: RateLimitPerIp
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 2000 # requests per 5-minute sliding window per source IP
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}RateLimitPerIp"

  # ---------------------------------------------------------------------
  # Pairing-attempt observability (spec v1.1 pass 3 correction 5 / AWS
  # hackathon-final pass P1-10): app/observability.py's `audit_log` emits
  # one structured JSON line per pairing outcome
  # (`device_pairing_failed` / `device_pairing_rate_limited` /
  # `device_pairing_succeeded`) to BackendLogGroup via the ECS `awslogs`
  # driver. These two metric filters turn those log lines into real
  # CloudWatch metrics, and the two alarms below fire on sustained
  # failure/throttling volume — a real, deployable signal for "someone is
  # actively trying to brute-force pairing codes right now" rather than
  # something only discoverable after the fact by reading logs by hand.
  # ---------------------------------------------------------------------
  PairingFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterPattern: '{ $.audit_event = "device_pairing_failed" }'
      MetricTransformations:
        - MetricName: PairingFailures
          MetricNamespace: !Sub "${AWS::StackName}/Pairing"
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  PairingThrottlingMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterPattern: '{ $.audit_event = "device_pairing_rate_limited" }'
      MetricTransformations:
        - MetricName: PairingThrottled
          MetricNamespace: !Sub "${AWS::StackName}/Pairing"
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  PairingFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-pairing-failures"
      AlarmDescription: >
        Fires on sustained invalid/expired/already-used pairing-code
        attempts within a 5-minute window — the pattern an attacker
        guessing 6-digit pairing codes produces (each individual guess is
        indistinguishable from an honest typo, but the AGGREGATE volume
        is the signal). Threshold is set above plausible honest-user typo
        volume for a demo-scale deployment; tune per observed baseline
        before relying on it in a larger deployment.
      Namespace: !Sub "${AWS::StackName}/Pairing"
      MetricName: PairingFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PairingThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-pairing-throttling"
      AlarmDescription: >
        Fires when the application-layer PairingRateLimiter itself starts
        rejecting requests (HTTP 429) — a stronger, later-stage signal
        than PairingFailuresAlarm above: by this point a single
        (correctly, per P1-10, trusted-proxy-resolved) client IP has
        already exceeded the configured pairing-attempt budget.
      Namespace: !Sub "${AWS::StackName}/Pairing"
      MetricName: PairingThrottled
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # AWS hackathon-final pass, P2 (observability): every `require_demo_access_token`
  # / `require_master_demo_access_token` / WebSocket `credential_is_valid`
  # rejection (see backend/app/api/deps.py, backend/app/api/routes.py's
  # `race_websocket`) emits an `authentication_failed` audit-log line —
  # this was previously logged but never turned into a metric/alarm,
  # unlike the pairing-specific failures below. A sustained burst of these
  # (across REST *and* the WebSocket route, both included by this single
  # filter since both emit the identical `audit_event` value) is the
  # signature of credential stuffing / brute-forcing the demo token,
  # distinct from PairingFailuresAlarm (which only covers the
  # pairing-code exchange specifically).
  AuthenticationFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterPattern: '{ $.audit_event = "authentication_failed" }'
      MetricTransformations:
        - MetricName: AuthenticationFailures
          MetricNamespace: !Sub "${AWS::StackName}/Auth"
          MetricValue: "1"
          DefaultValue: 0

  AuthenticationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-authentication-failures"
      AlarmDescription: >
        Fires on sustained authentication failures (missing/invalid
        X-Demo-Access-Token on a REST route, or an invalid/missing
        WebSocket ?token= — see ADR 0002) within a 5-minute window. A
        higher threshold than PairingFailuresAlarm's, deliberately: this
        filter also counts ordinary, expected 401s from a client that
        simply hasn't paired yet, so it is tuned to catch a genuine burst
        rather than every isolated failed request.
      Namespace: !Sub "${AWS::StackName}/Auth"
      MetricName: AuthenticationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # AWS hackathon-final pass, phase 5 (observability). The two alarms
  # below read the new EMF-based application metrics from
  # backend/app/metrics.py (Namespace "PitWallCopilot" — see that
  # module's own docstring) directly, with NO AWS::Logs::MetricFilter in
  # front of them: unlike AuthenticationFailuresAlarm/PairingFailures
  # Alarm above (which extract a metric FROM plain audit-log JSON lines),
  # an EMF-shaped log line is already auto-extracted into a real
  # CloudWatch Metric by the platform the moment it reaches CloudWatch
  # Logs, so the alarm can reference "PitWallCopilot"/<MetricName>
  # directly. HONEST STATUS — representative subset, not full coverage:
  # this covers the two EMF metrics with a small, fixed dimension-value
  # set (Reason/Source), which is what makes a STATIC alarm well-defined.
  # SimulatorLeaseOwnershipChanged and StaleLeaderWriteRejected are
  # dimensioned by RaceId (see metrics.py), which is dynamic per race —
  # a static alarm cannot name a RaceId value in advance, so those two
  # are surfaced on OperationalDashboard below (queryable, browsable
  # across whatever RaceId values actually occurred) rather than alarmed
  # on directly; see docs/operations-runbook.md's phase 5 section for the
  # manual query to run when investigating one. PairingOutcome duplicates
  # ground PairingFailuresAlarm/PairingThrottled above already alarm on
  # (from the audit log, pre-dating this EMF module), so it is not
  # double-alarmed here either.
  EventBrokerDegradedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-event-broker-degraded"
      AlarmDescription: >
        Fires when the backend's cross-instance event broker (Redis/
        Valkey — see EnableCrossInstanceEventBroker) rejects or fails a
        publish (Reason=publish_failed — see
        app/services/event_broker.py's PublisherProtocol.publish
        exception handler). A sustained run of these means WebSocket
        clients connected to a DIFFERENT backend task than the one
        producing race-state updates are silently missing events — the
        exact failure mode BackendDesiredCountRequiresCrossInstanceBroker
        exists to prevent architecturally; this alarm is the runtime
        signal that the broker itself is unhealthy even though it was
        correctly provisioned.
      Namespace: PitWallCopilot
      MetricName: EventBrokerDegraded
      Dimensions:
        - Name: Reason
          Value: publish_failed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  BedrockThrottledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-bedrock-throttled"
      AlarmDescription: >
        Fires on sustained Bedrock throttling (Source=bedrock —
        see app/services/explanation_engine.py's explain_alert, which
        emits this on every real Bedrock invocation attempt regardless of
        outcome). The deterministic strategy engine remains the source of
        truth for every race fact either way (see LlmProvider's own
        description — Bedrock only ever explains, never calculates), so
        this alarm is about explanation-quality degradation (judges/
        users falling back to the template narrator more often than
        expected), not a race-correctness risk.
      Namespace: PitWallCopilot
      MetricName: BedrockThrottled
      Dimensions:
        - Name: Source
          Value: bedrock
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------
  # CloudWatch dashboard (AWS hackathon-final pass, P2 observability) — a
  # single at-a-glance operational view spanning every tier this stack
  # provisions: both ALBs, both ECS services, DynamoDB, both Lambdas, and
  # the application-level pairing/auth metric filters above. This does
  # not replace the alarms (dashboards don't page anyone) — it exists so
  # a human looking at the stack mid-demo or mid-incident has one URL
  # that shows the whole system's health, instead of stitching together
  # six separate console views.
  # ---------------------------------------------------------------------
  OperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: BothImagesProvided
    Properties:
      DashboardName: !Sub "${AWS::StackName}-operations"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": { "markdown": "# ${AWS::StackName} — Pit Wall Copilot operations" }
            },
            {
              "type": "metric", "x": 0, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Backend ALB — requests & errors",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${BackendLoadBalancer.LoadBalancerFullName}", { "stat": "Sum" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${BackendLoadBalancer.LoadBalancerFullName}", { "stat": "Sum" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${BackendLoadBalancer.LoadBalancerFullName}", { "stat": "p99", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "MCP-server ALB — requests & errors",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${McpLoadBalancer.LoadBalancerFullName}", { "stat": "Sum" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${McpLoadBalancer.LoadBalancerFullName}", { "stat": "Sum" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${McpLoadBalancer.LoadBalancerFullName}", { "stat": "p99", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "ECS — CPU & memory utilization",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${EcsCluster}", "ServiceName", "${BackendService.Name}" ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${EcsCluster}", "ServiceName", "${BackendService.Name}" ],
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${EcsCluster}", "ServiceName", "${McpService.Name}" ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${EcsCluster}", "ServiceName", "${McpService.Name}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 7, "width": 8, "height": 6,
              "properties": {
                "title": "DynamoDB — throttling & system errors",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${RaceStateTable}", { "stat": "Sum" } ],
                  [ "AWS/DynamoDB", "SystemErrors", "TableName", "${RaceStateTable}", { "stat": "Sum" } ],
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${RaceStateTable}", { "stat": "Sum", "yAxis": "right" } ],
                  [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${RaceStateTable}", { "stat": "Sum", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 7, "width": 8, "height": 6,
              "properties": {
                "title": "Lambda — errors & duration",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${WatchEvaluatorStreamFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${WatchEvaluatorStreamFunction}", { "stat": "p99", "yAxis": "right" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${AlexaSkillLegacyFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${AlexaSkillLegacyFunction}", { "stat": "p99", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 7, "width": 8, "height": 6,
              "properties": {
                "title": "Auth & pairing (application-level, from audit log)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "${AWS::StackName}/Auth", "AuthenticationFailures", { "stat": "Sum" } ],
                  [ "${AWS::StackName}/Pairing", "PairingFailures", { "stat": "Sum" } ],
                  [ "${AWS::StackName}/Pairing", "PairingThrottled", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock & event broker (EMF application metrics, phase 5)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "PitWallCopilot", "BedrockInvocationLatency", "Source", "bedrock", { "stat": "p99" } ],
                  [ "PitWallCopilot", "BedrockThrottled", "Source", "bedrock", { "stat": "Sum", "yAxis": "right" } ],
                  [ "PitWallCopilot", "BedrockFallbackUsed", "Source", "bedrock", { "stat": "Sum", "yAxis": "right" } ],
                  [ "PitWallCopilot", "EventBrokerDegraded", "Reason", "publish_failed", { "stat": "Sum", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Simulator leadership (EMF, by RaceId — browse per race; see runbook)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ { "expression": "SEARCH('{PitWallCopilot,RaceId} MetricName=\"SimulatorLeaseOwnershipChanged\"', 'Sum', 300)", "label": "SimulatorLeaseOwnershipChanged" } ],
                  [ { "expression": "SEARCH('{PitWallCopilot,RaceId} MetricName=\"StaleLeaderWriteRejected\"', 'Sum', 300)", "label": "StaleLeaderWriteRejected" } ]
                ]
              }
            },
            {
              "type": "alarm", "x": 0, "y": 19, "width": 24, "height": 4,
              "properties": {
                "title": "Alarm status",
                "alarms": [
                  "${BackendUnhealthyHostsAlarm.Arn}",
                  "${RaceStateTableThrottleAlarm.Arn}",
                  "${RaceStateTableSystemErrorsAlarm.Arn}",
                  "${WatchEvaluatorErrorsAlarm.Arn}",
                  "${PairingFailuresAlarm.Arn}",
                  "${PairingThrottlingAlarm.Arn}",
                  "${AuthenticationFailuresAlarm.Arn}",
                  "${EventBrokerDegradedAlarm.Arn}",
                  "${BedrockThrottledAlarm.Arn}"
                ]
              }
            }
          ]
        }

  BackendWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref BackendLoadBalancer
      WebACLArn: !GetAtt RateLimitWebAcl.Arn

  McpWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref McpLoadBalancer
      WebACLArn: !GetAtt RateLimitWebAcl.Arn

  # ---------------------------------------------------------------------
  # ECR repositories for the two container images (built/pushed manually
  # per docs/deployment-runbook.md — CloudFormation provisions the empty
  # repository, it does not build or push images itself).
  # ---------------------------------------------------------------------
  BackendEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-backend"
      ImageScanningConfiguration:
        ScanOnPush: true

  McpServerEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-mcp-server"
      ImageScanningConfiguration:
        ScanOnPush: true

Outputs:
  TableName:
    Value: !Ref RaceStateTable
  TableArn:
    Description: >
      Spec v1.1 correction 10 review: the table name alone was output
      before, but several IAM/CLI workflows (e.g. scoping an ad-hoc
      policy, `aws dynamodb describe-table --table-name` doesn't need
      this, but cross-account/cross-stack references do) want the full
      ARN, and constructing it by hand from the name is exactly the kind
      of thing an Output exists to avoid.
    Value: !GetAtt RaceStateTable.Arn
  RaceStateTableKeyArn:
    Description: >
      AWS hackathon-final pass, P1-11: the customer-managed KMS key ARN
      RaceStateTable is encrypted with — needed for any cross-account
      grant or key-policy review workflow.
    Value: !GetAtt RaceStateTableKey.Arn
  EcsClusterName:
    Description: For `aws ecs describe-services`/`update-service`/`exec` during manual debugging.
    Value: !Ref EcsCluster
  BackendEcsServiceName:
    Condition: BackendImageProvided
    Value: !GetAtt BackendService.Name
  McpEcsServiceName:
    Condition: McpImageProvided
    Value: !GetAtt McpService.Name
  DemoAccessTokenSecretArn:
    Description: Pass to `aws secretsmanager get-secret-value` to read the generated demo access token.
    Value: !Ref DemoAccessTokenSecret
  McpAccessTokenSecretArn:
    Description: >
      Pass to `aws secretsmanager get-secret-value` to read the generated
      MCP inbound bearer token (spec v1.1 correction 3). Supply this to
      alexa_plus_client/ (and any other MCP client) as its
      PIT_WALL_MCP_ACCESS_TOKEN — never the demo access token above.
    Value: !Ref McpAccessTokenSecret
  WatchEvaluatorStreamFunctionArn:
    Value: !GetAtt WatchEvaluatorStreamFunction.Arn
  AlexaSkillLegacyFunctionArn:
    Description: >
      Paste this into the Alexa Developer Console's Endpoint configuration
      for the LEGACY skill created from
      legacy/alexa_skill_legacy_rest/models/interaction-model.json — see
      legacy/README.md for why this is optional/non-primary.
    Value: !GetAtt AlexaSkillLegacyFunction.Arn
  BackendEcrRepositoryUri:
    Value: !GetAtt BackendEcrRepository.RepositoryUri
  McpServerEcrRepositoryUri:
    Value: !GetAtt McpServerEcrRepository.RepositoryUri
  BackendUrl:
    Condition: BackendImageProvided
    Description: >
      Uses https:// whenever CertificateArn was supplied (the required
      secure default — spec v1.1 correction 4); only ever http:// when
      AllowInsecureDemoHttp=true was explicitly passed at deploy time (see
      the Rules section above, which refuses any deploy that has neither).
    Value: !Sub
      - "${Scheme}://${DnsName}"
      - Scheme: !If [HasCertificate, "https", "http"]
        DnsName: !GetAtt BackendLoadBalancer.DNSName
  McpServerUrl:
    Condition: McpImageProvided
    Description: >
      Same https:// default as BackendUrl above. Fire TV derives its
      wss:// WebSocket URL from this by substituting the scheme (see
      pit-wall-fire-tv's config/environment handling) — an https:// value
      here yields wss://, never plaintext ws://, once TLS is configured.
    Value: !Sub
      - "${Scheme}://${DnsName}"
      - Scheme: !If [HasCertificate, "https", "http"]
        DnsName: !GetAtt McpLoadBalancer.DNSName

  OperationalDashboardUrl:
    Condition: BothImagesProvided
    Description: >
      AWS hackathon-final pass, P2 (observability): direct console link to
      OperationalDashboard — one view across both ALBs, both ECS services,
      DynamoDB, both Lambdas, and the application-level auth/pairing
      metric filters. See docs/observability-runbook.md.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OperationalDashboard}"
