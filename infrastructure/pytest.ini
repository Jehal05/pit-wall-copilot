[pytest]
testpaths = tests
# Spec v1.1 pass 3, correction 10: see backend/pytest.ini for the full
# rationale. Every test in this directory validates the SAM/CloudFormation
# template statically (cfn-lint-style assertions against template.yaml) —
# tests/conftest.py auto-tags all of them `infrastructure`.
addopts = --strict-markers
markers =
    unit: fast, dependency-free test
    integration: exercises multiple real components together
    infrastructure: validates AWS SAM/CloudFormation templates
    android: requires the Android SDK/Gradle toolchain — not applicable here
    aws: requires a REAL (non-mocked) AWS account/credentials — not applicable here (this suite is static template validation, no deploy)
    device: requires a real physical device — not applicable here
