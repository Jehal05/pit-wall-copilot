[pytest]
testpaths = tests
# Spec v1.1 pass 3, correction 10: see backend/pytest.ini for the full
# rationale. This suite calls the Lambda handler function in-process with
# synthetic Alexa request payloads — fast and dependency-free — so
# tests/conftest.py auto-tags all of them `unit`.
addopts = --strict-markers
markers =
    unit: fast, dependency-free test
    integration: exercises multiple real components together
    infrastructure: validates AWS SAM/CloudFormation templates — not applicable here
    android: requires the Android SDK/Gradle toolchain — not applicable here
    aws: requires a REAL (non-mocked) AWS account/credentials — not applicable here
    device: requires a real physical device — not applicable here
