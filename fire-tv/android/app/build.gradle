apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Release signing configuration.
 *
 * Release builds MUST NEVER use the debug keystore/credentials
 * (`signingConfigs.debug`). This repository does not commit a real
 * release keystore or any release signing credentials — see
 * `.gitignore` for the excluded `*.jks` / `*.keystore` /
 * `release.keystore.properties` patterns.
 *
 * Release credentials are resolved, in order:
 *   1. `release.keystore.properties` next to this file (uncommitted;
 *      see `release.keystore.properties.example` for the format).
 *   2. Environment variables:
 *        PIT_WALL_RELEASE_STORE_FILE
 *        PIT_WALL_RELEASE_STORE_PASSWORD
 *        PIT_WALL_RELEASE_KEY_ALIAS
 *        PIT_WALL_RELEASE_KEY_PASSWORD
 *   3. Gradle properties of the same names (e.g. from CI secrets via
 *      `-PPIT_WALL_RELEASE_STORE_FILE=...` or `gradle.properties`).
 *
 * If none of the four values are fully present, `releaseSigningConfig`
 * is `null` and the release build type is left WITHOUT a signingConfig
 * (an unsigned release artifact) rather than silently falling back to
 * the debug key. Building `assembleRelease` still succeeds in that
 * case (Gradle produces an unsigned APK), but the person building it
 * gets a warning printed at configuration time so this is never
 * mistaken for a properly signed artifact.
 *
 * See docs/deployment-runbook.md "Android release signing" for
 * PowerShell and Unix examples of supplying these values.
 */
def releaseKeystorePropertiesFile = file('release.keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { stream ->
        releaseKeystoreProperties.load(stream)
    }
}

def resolveReleaseSigningValue = { String propertyKey, String envKey ->
    def fromProperties = releaseKeystoreProperties.getProperty(propertyKey)
    if (fromProperties != null && !fromProperties.isEmpty()) {
        return fromProperties
    }
    def fromEnv = System.getenv(envKey)
    if (fromEnv != null && !fromEnv.isEmpty()) {
        return fromEnv
    }
    if (project.hasProperty(envKey)) {
        def fromGradleProperty = project.property(envKey)
        if (fromGradleProperty != null && !fromGradleProperty.toString().isEmpty()) {
            return fromGradleProperty.toString()
        }
    }
    return null
}

def releaseStoreFilePath = resolveReleaseSigningValue('storeFile', 'PIT_WALL_RELEASE_STORE_FILE')
def releaseStorePassword = resolveReleaseSigningValue('storePassword', 'PIT_WALL_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = resolveReleaseSigningValue('keyAlias', 'PIT_WALL_RELEASE_KEY_ALIAS')
def releaseKeyPassword = resolveReleaseSigningValue('keyPassword', 'PIT_WALL_RELEASE_KEY_PASSWORD')

def releaseSigningIsFullyConfigured = releaseStoreFilePath != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

if (!releaseSigningIsFullyConfigured) {
    logger.warn(
        'WARNING: Release signing credentials are not fully configured ' +
        '(release.keystore.properties / PIT_WALL_RELEASE_* env vars / ' +
        'Gradle properties). assembleRelease will produce an UNSIGNED ' +
        'artifact. It will NEVER fall back to the debug keystore. See ' +
        'docs/deployment-runbook.md "Android release signing".'
    )
}

/**
 * Spec v1.1 pass 4, mandatory correction 9: "fail the production release
 * pipeline if signing credentials are missing when a signed deliverable
 * is required — do NOT silently present an unsigned APK as finished."
 *
 * The warning above is deliberately not enough on its own: a CI log
 * warning is easy to miss, and an unsigned APK produced by a green
 * `assembleRelease` build looks, from the outside (a build-status badge,
 * a "build succeeded" notification), exactly like a real, signed release
 * artifact. This adds a second, opt-in, hard-fail gate: when
 * `PIT_WALL_REQUIRE_SIGNED_RELEASE=true` is set (as the CI release
 * workflow does — see .github/workflows/ci.yml's android-release job —
 * for a run whose whole job is to produce a signed deliverable), any
 * attempt to assemble or bundle a release artifact WITHOUT fully
 * configured signing credentials throws immediately, before Gradle does
 * any of the actual (wasted) release compilation/packaging work.
 *
 * Left OFF by default (`false`) so a local developer can still run
 * `./gradlew assembleRelease` without real signing credentials to sanity
 * -check that a release build compiles at all (spec v1.1 pass 3
 * correction 1's own "keep debug builds usable locally" extends
 * naturally to "don't force a developer to hold real signing secrets
 * just to smoke-test a release compile") — the hard-fail is specifically
 * for the pipeline that is asked to actually ship a signed artifact.
 */
def requireSignedRelease = (
    System.getenv('PIT_WALL_REQUIRE_SIGNED_RELEASE') ?:
    (project.hasProperty('PIT_WALL_REQUIRE_SIGNED_RELEASE') ? project.property('PIT_WALL_REQUIRE_SIGNED_RELEASE') : 'false')
).toString().toBoolean()

if (requireSignedRelease) {
    gradle.taskGraph.whenReady { taskGraph ->
        def releaseArtifactTaskRequested = taskGraph.allTasks.any { task ->
            def name = task.name
            (name.startsWith('assemble') || name.startsWith('bundle')) && name.toLowerCase().contains('release')
        }
        if (releaseArtifactTaskRequested && !releaseSigningIsFullyConfigured) {
            throw new GradleException(
                'PIT_WALL_REQUIRE_SIGNED_RELEASE=true but release signing credentials are ' +
                'NOT fully configured (need all four of: storeFile, storePassword, keyAlias, ' +
                'keyPassword — via release.keystore.properties, PIT_WALL_RELEASE_* environment ' +
                'variables, or matching Gradle properties). Refusing to produce an unsigned ' +
                'release artifact and present it as a finished deliverable. See ' +
                'docs/deployment-runbook.md "Android release signing" for how to supply these ' +
                'values in CI.'
            )
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.pitwallcopilot"
    defaultConfig {
        applicationId "com.pitwallcopilot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningIsFullyConfigured) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds may use the standard, non-secret debug keystore.
            signingConfig signingConfigs.debug
        }
        release {
            // Release builds must NEVER use the debug signing config.
            // When real release credentials are supplied (see the
            // "Release signing configuration" block above), the
            // `release` signingConfig defined above is used. When they
            // are not supplied, no signingConfig is attached here at
            // all — Gradle produces an unsigned release artifact
            // instead of silently signing with the debug key.
            if (releaseSigningIsFullyConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
